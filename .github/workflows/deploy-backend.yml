name: Deploy Backend API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: buckeye-api-jaabir
  DOTNET_VERSION: '10.0.x'
  WORKING_DIRECTORY: api

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        working-directory: api.Tests
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create deployment zip
        working-directory: ${{ env.WORKING_DIRECTORY }}/publish
        run: zip -r ../../deploy.zip .

      - name: Deploy to Azure via Kudu zip-deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          # Extract username and password from MSDeploy profile in the publish profile XML
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\$[^"]+"' | head -1 | sed 's/userName="//;s/"//')
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="[^"]+"' | head -1 | sed 's/userPWD="//;s/"//')
          
          # Deploy zip using Kudu API (the same endpoint Azure CLI uses internally)
          echo "Deploying to ${AZURE_WEBAPP_NAME}..."
          
          HTTP_CODE=$(curl -X POST \
            -u "$USERNAME:$PASSWORD" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/zip" \
            -o response.txt \
            -w "%{http_code}" \
            "https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false")
          
          echo "HTTP Status: $HTTP_CODE"
          cat response.txt
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed with status $HTTP_CODE"
            exit 1
          fi